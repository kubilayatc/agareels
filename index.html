<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>AgaReels - Agalarla Reels Keyfi</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }
        html, body {
            background-color: #000;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            height: 100%;
            height: 100dvh;
            width: 100%;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .app-container {
            width: 100%;
            max-width: 420px;
            height: 100%;
            height: 100dvh;
            background-color: #000;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        @media (min-width: 450px) {
            .app-container {
                height: 92dvh;
                border-radius: 20px;
                border: 1px solid #333;
            }
        }
        
        .content-area {
            flex: 1;
            position: relative;
            overflow: hidden;
            background: #000;
            height: calc(100% - 55px);
        }
        .page {
            display: none;
            height: 100%;
            width: 100%;
            overflow-y: auto;
            position: absolute;
            top: 0;
            left: 0;
            background: #000;
            z-index: 1;
        }
        .page.active {
            display: flex;
            flex-direction: column;
        }

        /* Alt Navigasyon Barı */
        .bottom-nav {
            height: 55px;
            min-height: 55px;
            background: #000;
            border-top: 1px solid #222;
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 50;
            padding-bottom: env(safe-area-inset-bottom);
        }
        .nav-item {
            color: #777;
            background: none;
            border: none;
            font-size: 1.2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            cursor: pointer;
            width: 25%;
        }
        .nav-item span { font-size: 0.65rem; }
        .nav-item.active { color: #fff; }
        .nav-item-plus {
            background: linear-gradient(45deg, #ff2851, #e6683c);
            color: #fff;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
        }

        /* Reels Ekranı */
        .reels-feed {
            height: 100%;
            width: 100%;
            overflow-y: scroll;
            scroll-snap-type: y mandatory;
            scrollbar-width: none;
        }
        .reels-feed::-webkit-scrollbar { display: none; }
        .reel-card {
            height: 100%;
            width: 100%;
            scroll-snap-align: start;
            scroll-snap-stop: always;
            position: relative;
            background: #111;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        video.fit-contain {
            object-fit: contain;
            background: #000;
        }
        .overlay-header {
            position: absolute;
            top: 0; left: 0; right: 0;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: linear-gradient(180deg, rgba(0,0,0,0.7) 0%, transparent 100%);
            z-index: 10;
        }
        .brand {
            font-size: 1.2rem;
            font-weight: 800;
            background: linear-gradient(45deg, #f09433, #e6683c, #dc2743);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .header-btn-group {
            display: flex;
            gap: 8px;
        }
        .btn-icon-top {
            background: rgba(0,0,0,0.5);
            border: none;
            color: #fff;
            width: 35px;
            height: 35px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(5px);
            font-size: 0.9rem;
        }

        .side-bar {
            position: absolute;
            right: 12px;
            bottom: 25px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 18px;
            z-index: 10;
        }
        .action-btn {
            background: transparent;
            border: none;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            cursor: pointer;
        }
        .action-btn i { font-size: 1.8rem; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.8)); }
        .action-btn i.active { color: #ff2851; }
        .action-btn span { font-size: 0.75rem; font-weight: 600; text-shadow: 0 1px 3px rgba(0,0,0,0.8); }
        
        .bottom-info {
            position: absolute;
            bottom: 20px;
            left: 15px;
            right: 70px;
            z-index: 10;
            text-shadow: 0 1px 4px rgba(0,0,0,0.8);
        }
        .user-tag {
            font-weight: 700;
            font-size: 0.95rem;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
            cursor: pointer;
        }
        
        /* Rozetler & Madalyalar */
        .badge {
            font-size: 0.65rem;
            padding: 3px 8px;
            border-radius: 12px;
            font-weight: 800;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            margin-top: 2px;
        }
        .badge-admin { background: linear-gradient(45deg, #ff2851, #dc2743); color: #fff; }
        .badge-bastaci { background: linear-gradient(45deg, #ffd700, #ff8c00); color: #000; }
        .badge-vip { background: linear-gradient(45deg, #8a2be2, #4b0082); color: #fff; }
        .badge-aga { background: rgba(255, 255, 255, 0.2); color: #ddd; }
        .badge-banned { background: #ff0000; color: #fff; }
        .badge-ultra {
            background: linear-gradient(45deg, #ff0055, #ff5000, #ffcc00, #9900ff);
            background-size: 300% 300%;
            animation: gradientAnimation 3s ease infinite;
            color: #fff;
            box-shadow: 0 0 12px rgba(255,0,85,0.8);
        }

        @keyframes gradientAnimation {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .medals-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 15px;
            text-align: left;
        }
        .medal-card {
            background: #1c1c1e;
            padding: 12px;
            border-radius: 12px;
            border: 1px solid #333;
        }
        .medal-card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
            font-size: 0.85rem;
            font-weight: bold;
        }
        .progress-bar-bg {
            background: #333;
            height: 8px;
            border-radius: 4px;
            overflow: hidden;
        }
        .progress-bar-fill {
            background: linear-gradient(90deg, #ff2851, #ffd700);
            height: 100%;
            width: 0%;
            transition: width 0.3s;
        }

        /* Arama Sayfası Stilleri */
        .search-header { padding: 15px; border-bottom: 1px solid #222; }
        .search-input-box {
            background: #1c1c1e;
            border-radius: 10px;
            padding: 10px 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .search-input-box input { background: none; border: none; color: white; outline: none; width: 100%; }
        .search-section-title { font-size: 0.85rem; color: #ff2851; font-weight: bold; margin: 15px 15px 5px 15px; }
        .user-search-list { padding: 0 15px; display: flex; flex-direction: column; gap: 8px; }
        .user-search-card {
            background: #1c1c1e;
            padding: 10px 12px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            border: 1px solid #2c2c2e;
        }
        .user-search-info { display: flex; align-items: center; gap: 10px; }
        .search-results { padding: 0 15px 15px 15px; display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
        .search-card {
            background: #111;
            border-radius: 10px;
            overflow: hidden;
            position: relative;
            height: 180px;
            cursor: pointer;
        }
        .search-card video { width: 100%; height: 100%; object-fit: cover; }
        .search-card-info {
            position: absolute; bottom: 0; left: 0; right: 0;
            padding: 8px; background: linear-gradient(0deg, rgba(0,0,0,0.8), transparent);
            font-size: 0.75rem;
        }

        .profile-page-content { padding: 20px; text-align: center; }
        .profile-avatar-large {
            width: 90px; height: 90px; border-radius: 50%; margin: 10px auto;
            display: flex; align-items: center; justify-content: center;
            font-size: 2.5rem; font-weight: bold; background-size: cover; background-position: center;
            border: 2px solid #ff2851;
        }
        .friends-counter-badge {
            background: #2c2c2e;
            color: #ffd700;
            font-size: 0.8rem;
            font-weight: bold;
            padding: 6px 14px;
            border-radius: 20px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            margin: 8px 0;
            border: 1px solid #444;
        }
        .form-group { margin-bottom: 15px; text-align: left; }
        .form-group label { display: block; margin-bottom: 5px; font-size: 0.85rem; color: #aaa; }
        .form-input, .form-select { width: 100%; padding: 10px; background: #2c2c2e; border: 1px solid #444; border-radius: 8px; color: white; outline: none; }
        .btn-primary { width: 100%; padding: 12px; background: #ff2851; border: none; color: white; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 5px; }

        .modal {
            display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); z-index: 100; flex-direction: column; justify-content: flex-end; backdrop-filter: blur(5px);
        }
        .modal-content { background: #1c1c1e; border-top-left-radius: 20px; border-top-right-radius: 20px; padding: 20px; max-height: 85%; overflow-y: auto; }
        .comments-list { display: flex; flex-direction: column; gap: 12px; margin-bottom: 15px; }
        .comment-item { display: flex; gap: 10px; font-size: 0.85rem; }
        .avatar {
            width: 34px; height: 34px; border-radius: 50%; background: #444; display: flex; align-items: center; justify-content: center;
            font-weight: bold; font-size: 0.85rem; flex-shrink: 0; background-size: cover; background-position: center; cursor: pointer;
        }
        .comment-body { background: #2c2c2e; padding: 8px 12px; border-radius: 12px; flex: 1; }
        .comment-user { font-weight: 700; font-size: 0.8rem; margin-bottom: 2px; display: flex; gap: 5px; align-items: center; flex-wrap: wrap; cursor: pointer; }
        .comment-input-row { display: flex; gap: 8px; }
        .comment-input { flex: 1; background: #2c2c2e; border: none; padding: 10px 14px; border-radius: 20px; color: white; outline: none; }
        .btn-send { background: #ff2851; border: none; color: white; padding: 0 16px; border-radius: 20px; font-weight: 600; cursor: pointer; }
        
        .user-list-item { display: flex; flex-direction: column; gap: 8px; padding: 12px; background: #2c2c2e; border-radius: 8px; margin-bottom: 8px; }
        .user-item-top { display: flex; justify-content: space-between; align-items: center; }
        .user-actions { display: flex; gap: 4px; flex-wrap: wrap; }
        .btn-sm { padding: 4px 8px; font-size: 0.7rem; border-radius: 6px; border: none; cursor: pointer; color: #fff; }
        .btn-bastaci { background: #ffd700; color: #000; font-weight: bold; }
        .btn-vip { background: #8a2be2; font-weight: bold; }
        .btn-ban { background: #ff2851; font-weight: bold; }
        .btn-medal-manage { background: #0088ff; color: white; font-weight: bold; }
        .btn-delete-video { background: #ff2851; color: white; font-weight: bold; }
        .btn-friend-add { background: #ff2851; color: white; font-weight: bold; padding: 8px 16px; border-radius: 20px; border: none; cursor: pointer; font-size: 0.8rem; margin-top: 10px; }
        .btn-friend-remove { background: #444; color: #ccc; font-weight: bold; padding: 8px 16px; border-radius: 20px; border: none; cursor: pointer; font-size: 0.8rem; margin-top: 10px; }
    </style>
</head>
<body>

<div class="app-container">
    <div class="content-area">
        
        <!-- 1. ANA SAYFA -->
        <div class="page active" id="pageHome">
            <div class="overlay-header">
                <button class="btn-icon-top" onclick="switchPage('pageSearch')"><i class="fa-solid fa-arrow-left"></i></button>
                <div class="brand"><i class="fa-solid fa-play-circle"></i> AgaReels</div>
                <div class="header-btn-group">
                    <button class="btn-icon-top" id="muteToggleBtn" onclick="toggleMuteAll()"><i class="fa-solid fa-volume-xmark" style="color:#ff2851;"></i></button>
                    <button class="btn-icon-top" onclick="openAdminPanel()"><i class="fa-solid fa-shield-halved"></i></button>
                </div>
            </div>
            <div class="reels-feed" id="reelsFeed"></div>
        </div>

        <!-- 2. ARAMA SAYFASI -->
        <div class="page" id="pageSearch">
            <div class="search-header">
                <div class="search-input-box">
                    <i class="fa-solid fa-magnifying-glass" style="color: #666;"></i>
                    <input type="text" id="searchInput" placeholder="Reels veya aga ara..." oninput="filterSearch()">
                </div>
            </div>
            
            <div id="userSearchResultsContainer"></div>
            <div class="search-section-title" id="reelsSearchTitle">🎬 REELS VİDEOLARI</div>
            <div class="search-results" id="searchResults"></div>
        </div>

        <!-- 3. PROFİL SAYFASI -->
        <div class="page" id="pageProfile">
            <div class="profile-page-content" id="profileContainer"></div>
        </div>

    </div>

    <!-- Alt Navigasyon Barı -->
    <div class="bottom-nav">
        <button class="nav-item active" id="navHomeBtn" onclick="switchPage('pageHome', this)">
            <i class="fa-solid fa-house"></i>
            <span>Ana Sayfa</span>
        </button>
        <button class="nav-item" id="navSearchBtn" onclick="switchPage('pageSearch', this)">
            <i class="fa-solid fa-magnifying-glass"></i>
            <span>Arama</span>
        </button>
        <button class="nav-item" onclick="openUploadModal()">
            <div class="nav-item-plus"><i class="fa-solid fa-plus"></i></div>
        </button>
        <button class="nav-item" id="navProfileBtn" onclick="switchPage('pageProfile', this)">
            <i class="fa-solid fa-user"></i>
            <span>Profil</span>
        </button>
    </div>
</div>

<!-- Video Yükleme Modalı -->
<div class="modal" id="uploadModal">
    <div class="modal-content">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
            <h3>Video Yükle 🎬</h3>
            <button style="background:none; border:none; color:#888; font-size:1.2rem; cursor:pointer;" onclick="closeModal('uploadModal')">&times;</button>
        </div>
        
        <div class="form-group">
            <label>Direct Video URL (MP4 Bağlantısı)</label>
            <input type="text" id="videoUrlInput" class="form-input" placeholder="https://ornek.com/video.mp4">
        </div>
        <div class="form-group">
            <label>Video Görünüm Modu</label>
            <select id="videoFitInput" class="form-select">
                <option value="contain">🖼️ Sığdır (Kırpma yok, tam görünüm)</option>
                <option value="cover">📱 Tam Ekran Doldur (Dikey videolar için)</option>
            </select>
        </div>
        <div class="form-group">
            <label>Açıklama</label>
            <input type="text" id="videoDescInput" class="form-input" placeholder="Agalara özel mesaj...">
        </div>
        <button class="btn-primary" onclick="uploadVideo()">Videoyu Yayınla</button>
    </div>
</div>

<!-- Kullanıcı Profil Detay Modalı (Başka Kullanıcıya Bakarken) -->
<div class="modal" id="userCardModal">
    <div class="modal-content" style="text-align: center;">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
            <h3>Kullanıcı Profili</h3>
            <button style="background:none; border:none; color:#888; font-size:1.2rem; cursor:pointer;" onclick="closeModal('userCardModal')">&times;</button>
        </div>
        <div id="userCardContent"></div>
    </div>
</div>

<!-- Arkadaş Listesi Modalı -->
<div class="modal" id="friendsListModal">
    <div class="modal-content">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
            <h3 id="friendsModalTitle">Arkadaşlar</h3>
            <button style="background:none; border:none; color:#888; font-size:1.2rem; cursor:pointer;" onclick="closeModal('friendsListModal')">&times;</button>
        </div>
        <div id="friendsListContainer" style="display:flex; flex-direction:column; gap:10px;"></div>
    </div>
</div>

<!-- Yorumlar Modalı -->
<div class="modal" id="commentsModal">
    <div class="modal-content">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
            <h3>Yorumlar</h3>
            <button style="background:none; border:none; color:#888; font-size:1.2rem; cursor:pointer;" onclick="closeModal('commentsModal')">&times;</button>
        </div>
        <div class="comments-list" id="commentsList"></div>
        <div class="comment-input-row">
            <input type="text" id="commentInput" class="comment-input" placeholder="Yorum yaz...">
            <button class="btn-send" onclick="addComment()">Gönder</button>
        </div>
    </div>
</div>

<!-- Admin Yönetim Paneli Modalı -->
<div class="modal" id="adminModal">
    <div class="modal-content">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
            <h3 style="color:#ff2851;">Admin Yönetim Paneli 🔥</h3>
            <button style="background:none; border:none; color:#888; font-size:1.2rem; cursor:pointer;" onclick="closeModal('adminModal')">&times;</button>
        </div>

        <h4 style="margin-bottom: 10px; color: #ff2851;">🎬 Yüklü Videoları Yönet & Sil</h4>
        <div id="adminVideosListContainer" style="margin-bottom: 20px;"></div>

        <hr style="border-color: #333; margin: 20px 0;">

        <h4 style="margin-bottom: 10px; color: #ffd700;">Kullanıcı Yetki & Madalya Yönetimi</h4>
        <div id="usersListContainer"></div>
    </div>
</div>

<script>
    const initialVideos = [
        {
            id: 1,
            url: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4",
            user: "AdminAga",
            userRole: "admin",
            desc: "AgaReels Profil Güncellemesi ve Hata Düzeltmeleri ile Yayında! 🔥",
            fit: "contain",
            likes: 25,
            isLiked: false,
            comments: []
        }
    ];

    let users = JSON.parse(localStorage.getItem('agareels_users')) || [
        { 
            username: "AdminAga", 
            pass: "5824!", 
            role: "admin", 
            avatar: "", 
            isBanned: false,
            selectedTag: "👑 Admin Aga",
            friends: [],
            stats: { watched: [1,2,3,4,5], liked: [1,2,3,4,5], commented: [1,2,3,4,5] } 
        }
    ];
    let videos = JSON.parse(localStorage.getItem('agareels_videos')) || initialVideos;
    let currentUser = JSON.parse(localStorage.getItem('agareels_current_user')) || null;

    let activeVideoId = null;
    let isGlobalMuted = true;

    const MEDAL_LEVELS = [
        { count: 5, name: "Bronz", icon: "🥉" },
        { count: 15, name: "Gümüş", icon: "🥈" },
        { count: 30, name: "Altın", icon: "🥇" },
        { count: 50, name: "Elmas", icon: "💎" },
        { count: 75, name: "Yakut", icon: "🔻" }
    ];

    window.onload = function() {
        renderFeed();
        renderSearch();
        renderProfilePage();
        setupScrollObserver();
    };

    function toggleMuteAll() {
        isGlobalMuted = !isGlobalMuted;
        const btnIcon = document.querySelector('#muteToggleBtn i');

        document.querySelectorAll('video').forEach(v => {
            v.muted = isGlobalMuted;
        });

        if (isGlobalMuted) {
            btnIcon.className = 'fa-solid fa-volume-xmark';
            btnIcon.style.color = '#ff2851';
        } else {
            btnIcon.className = 'fa-solid fa-volume-high';
            btnIcon.style.color = '#fff';
        }
    }

    function getUserStats(userObj) {
        if (!userObj || !userObj.stats) return { watched: [], liked: [], commented: [] };
        return userObj.stats;
    }

    function getUserFriends(userObj) {
        if (!userObj || !userObj.friends) return [];
        return userObj.friends;
    }

    function getUserAvailableTags(userObj) {
        if (!userObj) return [];
        if (userObj.isBanned) return ['🚫 BANLI'];

        let tags = [];

        if (userObj.role === 'admin' || userObj.username === "AdminAga") {
            tags.push('👑 Admin Aga', '👑 BaştacıAga', '😈 VipPiç', '🔥 ULTRA MEGA AGA 🔥');
        } else if (userObj.role === 'bastaci') {
            tags.push('👑 BaştacıAga');
        } else if (userObj.role === 'vip') {
            tags.push('😈 VipPiç');
        } else {
            tags.push('🤡 Küçük31ci');
        }

        const stats = getUserStats(userObj);
        const wCount = (stats.watched || []).length;
        const lCount = (stats.liked || []).length;
        const cCount = (stats.commented || []).length;

        if (wCount >= 75 && lCount >= 75 && cCount >= 75) {
            if (!tags.includes('🔥 ULTRA MEGA AGA 🔥')) tags.push('🔥 ULTRA MEGA AGA 🔥');
        }

        const getTier = (cnt, type) => {
            let current = null;
            for (let lvl of MEDAL_LEVELS) {
                if (cnt >= lvl.count) current = `${lvl.icon} ${lvl.name} ${type}`;
            }
            return current;
        };

        const wMedal = getTier(wCount, "İzleyici");
        const lMedal = getTier(lCount, "Beğenici");
        const cMedal = getTier(cCount, "Yorumcu");

        if (wMedal) tags.push(wMedal);
        if (lMedal) tags.push(lMedal);
        if (cMedal) tags.push(cMedal);

        return tags;
    }

    function getBadgesHTML(userObj) {
        if (!userObj) return '';
        if (userObj.isBanned) return '<span class="badge badge-banned">🚫 BANLI</span>';

        const availableTags = getUserAvailableTags(userObj);
        let tagToDisplay = userObj.selectedTag;

        if (!tagToDisplay || !availableTags.includes(tagToDisplay)) {
            tagToDisplay = availableTags[0] || '🤡 Küçük31ci';
        }

        let bgClass = 'badge-aga';
        if (tagToDisplay.includes('Admin')) bgClass = 'badge-admin';
        else if (tagToDisplay.includes('Baştacı')) bgClass = 'badge-bastaci';
        else if (tagToDisplay.includes('Vip')) bgClass = 'badge-vip';
        else if (tagToDisplay.includes('ULTRA')) bgClass = 'badge-ultra';

        return `<span class="badge ${bgClass}">${tagToDisplay}</span>`;
    }

    function openUserProfileCard(username) {
        const u = users.find(x => x.username.toLowerCase() === username.toLowerCase());

            const wCount = (stats.watched || []).length;
            const lCount = (stats.liked || []).length;
            const cCount = (stats.commented || []).length;

            let isFriend = false;
            let isSelf = false;

            if (currentUser) {
                if (currentUser.username.toLowerCase() === u.username.toLowerCase()) isSelf = true;
                const myFriends = getUserFriends(currentUser);
                if (myFriends.includes(u.username)) isFriend = true;
            }

                } else {

                }
            }

                let nextTarget = 75;
                for (let lvl of MEDAL_LEVELS) {

                }
                const pct = Math.min(100, Math.round((count / nextTarget) * 100));

                return `
                    <div class="medal-card">

                            <span>${title}</span>
                            <span style="color:#ffd700;">${count} / ${nextTarget} Reels</span>

                            <div class="progress-bar-fill" style="width: ${pct}%;"></div>
                        </div>
                    </div>
                `;
            };

            cardContent.innerHTML = `
                <div class="profile-avatar-large" style="${avatarBg}">${initial}</div>
                <h2>@${u.username}</h2>
                <div class="friends-counter-badge" onclick="openFriendsList('${u.username}')">

    function toggleFriend(targetUsername) {
        if (!currentUser) return alert("Arkadaş eklemek için giriş yapmalısınız!");

        let myObj = users.find(x => x.username === currentUser.username);
        let targetObj = users.find(x => x.username === targetUsername);

        if (!myObj || !targetObj) return;

        myObj.friends = myObj.friends || [];
        targetObj.friends = targetObj.friends || [];

        if (myObj.friends.includes(targetUsername)) {
            myObj.friends = myObj.friends.filter(f => f !== targetUsername);
            targetObj.friends = targetObj.friends.filter(f => f !== myObj.username);
            alert(`@${targetUsername} arkadaş listenizden çıkarıldı.`);
        } else {
            myObj.friends.push(targetUsername);
            if (!targetObj.friends.includes(myObj.username)) targetObj.friends.push(myObj.username);
            alert(`@${targetUsername} ile arkadaş olundu! 🎉`);
        }

        currentUser.friends = myObj.friends;
        localStorage.setItem('agareels_users', JSON.stringify(users));

        openUserProfileCard(targetUsername);

    function setupScrollObserver() {
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                const video = entry.target.querySelector('video');
                const card = entry.target;
                const videoId = parseInt(card.dataset.id || "1");

                if (video) {
                    video.muted = isGlobalMuted;
                    if (entry.isIntersecting) {
                        let playPromise = video.play();
                        if (playPromise !== undefined) {
                            playPromise.catch(() => {
                                video.muted = true;
                                video.play().catch(()=>{});
                            });
                        }
                        recordStat('watched', videoId);
                    } else {
                        video.pause();
                    }
                }
            });
        }, { threshold: 0.6 });

        document.querySelectorAll('.reel-card').forEach(card => observer.observe(card));
    }

    function recordStat(type, videoId) {
        if (!currentUser) return;
        let u = users.find(x => x.username === currentUser.username);
        if (!u) return;

        let stats = getUserStats(u);
        if (!stats[type].includes(videoId)) {
            stats[type].push(videoId);
            currentUser.stats = stats;
            localStorage.setItem('agareels_users', JSON.stringify(users));
            localStorage.setItem('agareels_current_user', JSON.stringify(currentUser));
        }
    }

    function togglePlay(v) {

    function toggleLike(id) {
        if (!currentUser) return alert("Beğenmek için önce giriş yapmalısınız!");

        const video = videos.find(v => v.id === id);
        if (video) {
            video.isLiked = !video.isLiked;
            video.likes += video.isLiked ? 1 : -1;
            if (video.isLiked) recordStat('liked', id);
            saveAndRefresh();
        }
    }

    function handleAuth() {
        const u = document.getElementById('authUsername').value.trim();
        const p = document.getElementById('authPassword').value.trim();

        if (!u || !p) return alert("Alanları doldurun!");

        let existingUser = users.find(x => x.username.toLowerCase() === u.toLowerCase());

        if (existingUser) {
            if (existingUser.isBanned) return alert("🚫 Bu hesap BANLANMIŞTIR!");
            if (existingUser.pass === p) currentUser = existingUser;
            else return alert("Hatalı şifre!");
        } else {
            let newUser = { 
                username: u, pass: p, role: "aga", avatar: "", isBanned: false, selectedTag: "🤡 Küçük31ci", friends: [],
                stats: { watched: [], liked: [], commented: [] }
            };
            users.push(newUser);
            currentUser = newUser;
            localStorage.setItem('agareels_users', JSON.stringify(users));
        }

        localStorage.setItem('agareels_current_user', JSON.stringify(currentUser));
        renderProfilePage();
        renderFeed();
    }

            reader.onload = function(e) {
                const base64Avatar = e.target.result;
                currentUser.avatar = base64Avatar;

                let u = users.find(x => x.username.toLowerCase() === currentUser.username.toLowerCase());
                if (u) u.avatar = base64Avatar;

                localStorage.setItem('agareels_users', JSON.stringify(users));
                localStorage.setItem('agareels_current_user', JSON.stringify(currentUser));
                
                renderProfilePage();
                renderFeed();
                alert("Profil fotoğrafı güncellendi! 🎉");
            };
            reader.readAsDataURL(file);
        }
    }

                    <div class="avatar" style="${avatarStyle}" onclick="openUserProfileCard('${c.user}')">${initial}</div>
                    <div class="comment-body">
                        <div class="comment-user" onclick="openUserProfileCard('${c.user}')">
                            @${c.user} ${getBadgesHTML(commentUserObj)}
                        </div>
                        <div>${c.text}</div>
                    </div>
                </div>
            `;
        });
    }

    function addComment() {
        if (!currentUser) return alert("Önce giriş yapmalısın!");
        if (currentUser.isBanned) return alert("🚫 Banlandığınız için işlem yapamazsınız!");

        const input = document.getElementById('commentInput');
        const text = input.value.trim();

        if (text && activeVideoId) {
            const video = videos.find(v => v.id === activeVideoId);
            video.comments.push({ user: currentUser.username, role: currentUser.role, avatar: currentUser.avatar || '', text: text });
            input.value = '';
            
            recordStat('commented', activeVideoId);
            renderComments();
            saveAndRefresh();
        }
    }

    function uploadVideo() {
        if (!currentUser) return alert('Giriş yapmalısınız!');

        const urlInput = document.getElementById('videoUrlInput');
        const descInput = document.getElementById('videoDescInput');
        const fitInput = document.getElementById('videoFitInput');
        const videoUrl = urlInput.value.trim();

        if (!videoUrl) return alert('Geçerli bir video URL adresi girin!');

        const newVideo = {
            id: Date.now(),
            url: videoUrl,
            user: currentUser.username,
            userRole: currentUser.role,
            desc: descInput.value || "Yeni Reels!",
            fit: fitInput.value || "contain",
            likes: 0,
            isLiked: false,
            comments: []
        };

        videos.unshift(newVideo);
        saveAndRefresh();
        urlInput.value = '';
        descInput.value = '';
        closeModal('uploadModal');
        switchPage('pageHome', document.getElementById('navHomeBtn'));
    }

    function closeModal(id) { document.getElementById(id).style.display = 'none'; }
    function saveAndRefresh() {
        localStorage.setItem('agareels_videos', JSON.stringify(videos));
        renderFeed();
        setupScrollObserver();
    }
</script>
</body>
</html>
