<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AgaReels - Agalarla Reels Keyfi</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }
        body {
            background-color: #000;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .app-container {
            width: 100%;
            max-width: 420px;
            height: 100vh;
            background-color: #000;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        @media (min-width: 450px) {
            .app-container {
                height: 92vh;
                border-radius: 20px;
                border: 1px solid #333;
            }
        }
        
        .content-area {
            flex: 1;
            position: relative;
            overflow: hidden;
        }
        .page {
            display: none;
            height: 100%;
            width: 100%;
            overflow-y: auto;
            position: absolute;
            top: 0;
            left: 0;
            background: #000;
            z-index: 1;
        }
        .page.active {
            display: flex;
            flex-direction: column;
        }

        /* Alt Navigasyon Barı */
        .bottom-nav {
            height: 55px;
            background: #000;
            border-top: 1px solid #222;
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 50;
        }
        .nav-item {
            color: #777;
            background: none;
            border: none;
            font-size: 1.2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            cursor: pointer;
            width: 25%;
        }
        .nav-item span { font-size: 0.65rem; }
        .nav-item.active { color: #fff; }
        .nav-item-plus {
            background: linear-gradient(45deg, #ff2851, #e6683c);
            color: #fff;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
        }

        /* Reels Ekranı */
        .reels-feed {
            height: 100%;
            width: 100%;
            overflow-y: scroll;
            scroll-snap-type: y mandatory;
            scrollbar-width: none;
        }
        .reels-feed::-webkit-scrollbar { display: none; }
        .reel-card {
            height: 100%;
            width: 100%;
            scroll-snap-align: start;
            scroll-snap-stop: always;
            position: relative;
            background: #111;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .overlay-header {
            position: absolute;
            top: 0; left: 0; right: 0;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: linear-gradient(180deg, rgba(0,0,0,0.7) 0%, transparent 100%);
            z-index: 10;
        }
        .brand {
            font-size: 1.2rem;
            font-weight: 800;
            background: linear-gradient(45deg, #f09433, #e6683c, #dc2743);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .btn-back {
            background: rgba(0,0,0,0.5);
            border: none;
            color: #fff;
            width: 35px;
            height: 35px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(5px);
        }

        .side-bar {
            position: absolute;
            right: 12px;
            bottom: 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 18px;
            z-index: 10;
        }
        .action-btn {
            background: transparent;
            border: none;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            cursor: pointer;
        }
        .action-btn i { font-size: 1.8rem; }
        .action-btn i.active { color: #ff2851; }
        .action-btn span { font-size: 0.75rem; font-weight: 600; }
        
        .bottom-info {
            position: absolute;
            bottom: 20px;
            left: 15px;
            right: 70px;
            z-index: 10;
        }
        .user-tag {
            font-weight: 700;
            font-size: 0.95rem;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }
        
        /* Rozetler & Madalyalar */
        .badge {
            font-size: 0.65rem;
            padding: 3px 8px;
            border-radius: 12px;
            font-weight: 800;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            margin-top: 2px;
        }
        .badge-admin { background: linear-gradient(45deg, #ff2851, #dc2743); color: #fff; }
        .badge-bastaci { background: linear-gradient(45deg, #ffd700, #ff8c00); color: #000; }
        .badge-vip { background: linear-gradient(45deg, #8a2be2, #4b0082); color: #fff; }
        .badge-aga { background: rgba(255, 255, 255, 0.2); color: #ddd; }
        .badge-banned { background: #ff0000; color: #fff; }
        .badge-ultra {
            background: linear-gradient(45deg, #ff0055, #ff5000, #ffcc00, #9900ff);
            background-size: 300% 300%;
            animation: gradientAnimation 3s ease infinite;
            color: #fff;
            box-shadow: 0 0 12px rgba(255,0,85,0.8);
        }

        @keyframes gradientAnimation {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Madalya Kartı Stilleri */
        .medals-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 15px;
            text-align: left;
        }
        .medal-card {
            background: #1c1c1e;
            padding: 12px;
            border-radius: 12px;
            border: 1px solid #333;
        }
        .medal-card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
            font-size: 0.85rem;
            font-weight: bold;
        }
        .progress-bar-bg {
            background: #333;
            height: 8px;
            border-radius: 4px;
            overflow: hidden;
        }
        .progress-bar-fill {
            background: linear-gradient(90deg, #ff2851, #ffd700);
            height: 100%;
            width: 0%;
            transition: width 0.3s;
        }

        /* Arama Ekranı */
        .search-header { padding: 15px; border-bottom: 1px solid #222; }
        .search-input-box {
            background: #1c1c1e;
            border-radius: 10px;
            padding: 10px 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .search-input-box input { background: none; border: none; color: white; outline: none; width: 100%; }
        .search-results { padding: 15px; display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
        .search-card {
            background: #111;
            border-radius: 10px;
            overflow: hidden;
            position: relative;
            height: 180px;
            cursor: pointer;
        }
        .search-card video { width: 100%; height: 100%; object-fit: cover; }
        .search-card-info {
            position: absolute; bottom: 0; left: 0; right: 0;
            padding: 8px; background: linear-gradient(0deg, rgba(0,0,0,0.8), transparent);
            font-size: 0.75rem;
        }

        /* Profil Sayfası */
        .profile-page-content { padding: 20px; text-align: center; }
        .profile-avatar-large {
            width: 90px; height: 90px; border-radius: 50%; margin: 10px auto;
            display: flex; align-items: center; justify-content: center;
            font-size: 2.5rem; font-weight: bold; background-size: cover; background-position: center;
            border: 2px solid #444;
        }
        .form-group { margin-bottom: 15px; text-align: left; }
        .form-group label { display: block; margin-bottom: 5px; font-size: 0.85rem; color: #aaa; }
        .form-input { width: 100%; padding: 10px; background: #2c2c2e; border: 1px solid #444; border-radius: 8px; color: white; outline: none; }
        .btn-primary { width: 100%; padding: 12px; background: #ff2851; border: none; color: white; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 5px; }

        /* Modal & Yorumlar */
        .modal {
            display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); z-index:
