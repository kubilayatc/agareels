<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AgaReels - Agalarla Reels Keyfi</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }
        body {
            background-color: #000;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .app-container {
            width: 100%;
            max-width: 420px;
            height: 100vh;
            background-color: #000;
            position: relative;
            overflow: hidden;
            box-shadow: 0 0 20px rgba(255,255,255,0.1);
        }
        @media (min-width: 450px) {
            .app-container {
                height: 92vh;
                border-radius: 20px;
                border: 1px solid #333;
            }
        }
        .reels-feed {
            height: 100%;
            width: 100%;
            overflow-y: scroll;
            scroll-snap-type: y mandatory;
            scrollbar-width: none;
        }
        .reels-feed::-webkit-scrollbar {
            display: none;
        }
        .reel-card {
            height: 100%;
            width: 100%;
            scroll-snap-align: start;
            scroll-snap-stop: always;
            position: relative;
            background: #111;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .overlay-header {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: linear-gradient(180deg, rgba(0,0,0,0.7) 0%, transparent 100%);
            z-index: 10;
        }
        .brand {
            font-size: 1.3rem;
            font-weight: 800;
            background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .header-actions {
            display: flex;
            gap: 10px;
        }
        .btn-icon-top {
            background: rgba(255, 255, 255, 0.2);
            border: none;
            color: #fff;
            padding: 8px 14px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .side-bar {
            position: absolute;
            right: 12px;
            bottom: 80px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 18px;
            z-index: 10;
        }
        .action-btn {
            background: transparent;
            border: none;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            cursor: pointer;
        }
        .action-btn i {
            font-size: 1.8rem;
            filter: drop-shadow(0 2px 5px rgba(0,0,0,0.5));
            transition: transform 0.2s;
        }
        .action-btn i.active {
            color: #ff2851;
        }
        .action-btn span {
            font-size: 0.75rem;
            font-weight: 600;
            text-shadow: 0 1px 3px rgba(0,0,0,0.8);
        }
        .bottom-info {
            position: absolute;
            bottom: 20px;
            left: 15px;
            right: 70px;
            z-index: 10;
            text-shadow: 0 1px 4px rgba(0,0,0,0.8);
        }
        .user-tag {
            font-weight: 700;
            font-size: 0.95rem;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .badge-admin {
            background: #ff2851;
            font-size: 0.65rem;
            padding: 2px 6px;
            border-radius: 4px;
            text-transform: uppercase;
        }
        .video-desc {
            font-size: 0.85rem;
            line-height: 1.3;
            opacity: 0.9;
        }
        .modal {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.85);
            z-index: 100;
            flex-direction: column;
            justify-content: flex-end;
            backdrop-filter: blur(5px);
        }
        .modal-content {
            background: #1c1c1e;
            border-top-left-radius: 20px;
            border-top-right-radius: 20px;
            padding: 20px;
            max-height: 70%;
            display: flex;
            flex-direction: column;
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid #333;
        }
        .modal-close {
            background: none;
            border: none;
            color: #888;
            font-size: 1.2rem;
            cursor: pointer;
        }
        .comments-list {
            overflow-y: auto;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 15px;
            padding-right: 5px;
        }
        .comment-item {
            display: flex;
            gap: 10px;
            font-size: 0.85rem;
            align-items: flex-start;
        }
        .avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: linear-gradient(135deg, #6e8efb, #a777e3);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 0.8rem;
            flex-shrink: 0;
        }
        .comment-body {
            background: #2c2c2e;
            padding: 8px 12px;
            border-radius: 12px;
            flex: 1;
        }
        .comment-user {
            font-weight: 700;
            font-size: 0.8rem;
            color: #aaa;
            margin-bottom: 2px;
            display: flex;
            justify-content: space-between;
        }
        .comment-input-area {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .username-row {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.8rem;
            color: #888;
        }
        .username-input {
            background: #2c2c2e;
            border: 1px solid #444;
            color: #fff;
            padding: 6px 10px;
            border-radius: 8px;
            font-size: 0.8rem;
            width: 140px;
        }
        .comment-input-row {
            display: flex;
            gap: 8px;
        }
        .comment-input {
            flex: 1;
            background: #2c2c2e;
            border: none;
            padding: 10px 14px;
            border-radius: 20px;
            color: white;
            outline: none;
        }
        .btn-send {
            background: #ff2851;
            border: none;
            color: white;
            padding: 0 16px;
            border-radius: 20px;
            font-weight: 600;
            cursor: pointer;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-size: 0.85rem;
            color: #aaa;
        }
        .form-input {
            width: 100%;
            padding: 10px;
            background: #2c2c2e;
            border: 1px solid #444;
            border-radius: 8px;
            color: white;
            outline: none;
        }
        .btn-primary {
            width: 100%;
            padding: 12px;
            background: #ff2851;
            border: none;
            color: white;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #888;
        }
        .empty-state i {
            font-size: 3rem;
            margin-bottom: 10px;
        }
        .heart-animation {
            position: absolute;
            color: #ff2851;
            font-size: 80px;
            pointer-events: none;
            transform: translate(-50%, -50%) scale(0);
            animation: popHeart 0.8s ease-out forwards;
            z-index: 20;
        }
        @keyframes popHeart {
            0% { transform: translate(-50%, -50%) scale(0); opacity: 0; }
            50% { transform: translate(-50%, -50%) scale(1.2); opacity: 1; }
            100% { transform: translate(-50%, -50%) scale(1) rotate(15deg); opacity: 0; }
        }
    </style>
</head>
<body>

<div class="app-container">
    <div class="overlay-header">
        <div class="brand">
            <i class="fa-solid fa-play-circle"></i> AgaReels
        </div>
        <div class="header-actions">
            <button class="btn-icon-top" onclick="openAdminModal()">
                <i class="fa-solid fa-plus"></i> Admin
            </button>
        </div>
    </div>

    <div class="reels-feed" id="reelsFeed"></div>
</div>

<!-- Yorumlar Modalı -->
<div class="modal" id="commentsModal">
    <div class="modal-content">
        <div class="modal-header">
            <h3>Yorumlar</h3>
            <button class="modal-close" onclick="closeCommentsModal()">&times;</button>
        </div>
        <div class="comments-list" id="commentsList"></div>
        <div class="comment-input-area">
            <div class="username-row">
                <span>Adın:</span>
                <input type="text" id="usernameInput" class="username-input" placeholder="Kullanıcı Adı">
            </div>
            <div class="comment-input-row">
                <input type="text" id="commentInput" class="comment-input" placeholder="Yorum yaz...">
                <button class="btn-send" onclick="addComment()">Gönder</button>
            </div>
        </div>
    </div>
</div>

<!-- Admin Video Yükleme Modalı -->
<div class="modal" id="adminModal">
    <div class="modal-content">
        <div class="modal-header">
            <h3>Video Yükle (Admin)</h3>
            <button class="modal-close" onclick="closeAdminModal()">&times;</button>
        </div>
        <div class="form-group">
            <label>Video Seç (MP4)</label>
            <input type="file" id="videoFileInput" accept="video/*" class="form-input">
        </div>
        <div class="form-group">
            <label>Video Başlığı / Açıklama</label>
            <input type="text" id="videoDescInput" class="form-input" placeholder="Agalara özel açıklama...">
        </div>
        <button class="btn-primary" onclick="uploadVideo()">Videoyu Yayınla</button>
    </div>
</div>

<script>
    // Başlangıç Örnek Videoları
    const initialVideos = [
        {
            id: 1,
            url: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4",
            user: "AdminAga",
            desc: "AgaReels yayın hayatına başladı! 🔥",
            likes: 12,
            isLiked: false,
            comments: [
                { user: "Amet", text: "Hayırlı olsun reis 👍" },
                { user: "Kubi", text: "Efsane olmuş!" }
            ]
        },
        {
            id: 2,
            url: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerEscapes.mp4",
            user: "AdminAga",
            desc: "Geceye bir Reels bırakalım 🌙",
            likes: 8,
            isLiked: false,
            comments: []
        }
    ];

    let videos = JSON.parse(localStorage.getItem('agareels_videos')) || initialVideos;
    let activeVideoId = null;

    // Kullanıcı adı kontrolü
    let currentUsername = localStorage.getItem('agareels_user') || 'Aga_' + Math.floor(Math.random()*1000);

    document.addEventListener("DOMContentLoaded", () => {
        document.getElementById('usernameInput').value = currentUsername;
        renderFeed();
        setupScrollObserver();
    });

    function renderFeed() {
        const feed = document.getElementById('reelsFeed');
        feed.innerHTML = '';

        if (videos.length === 0) {
            feed.innerHTML = `
                <div class="empty-state">
                    <i class="fa-solid fa-video-slash"></i>
                    <p>Henüz video yok.<br>Admin panelinden ilk videoyu ekle!</p>
                </div>
            `;
            return;
        }

        videos.forEach((video) => {
            const card = document.createElement('div');
            card.className = 'reel-card';
            card.dataset.id = video.id;

            card.innerHTML = `
                <video src="${video.url}" loop playsinline onclick="togglePlay(this)" onerror="handleVideoError(this)"></video>
                
                <div class="side-bar">
                    <button class="action-btn" onclick="toggleLike(${video.id})">
                        <i class="fa-solid fa-heart ${video.isLiked ? 'active' : ''}"></i>
                        <span>${video.likes}</span>
                    </button>
                    <button class="action-btn" onclick="openCommentsModal(${video.id})">
                        <i class="fa-solid fa-comment"></i>
                        <span>${video.comments.length}</span>
                    </button>
                </div>

                <div class="bottom-info">
                    <div class="user-tag">
                        @${video.user}
                        <span class="badge-admin">Admin</span>
                    </div>
                    <div class="video-desc">${video.desc}</div>
                </div>
            `;

            // Çift Tıklama Kalp
            let lastTap = 0;
            card.addEventListener('touchend', (e) => {
                const currentTime = new Date().getTime();
                const tapLength = currentTime - lastTap;
                if (tapLength < 300 && tapLength > 0) {
                    showHeartAnimation(e, card);
                    if (!video.isLiked) toggleLike(video.id);
                }
                lastTap = currentTime;
            });

            feed.appendChild(card);
        });
    }

    function setupScrollObserver() {
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                const video = entry.target.querySelector('video');
                if (video) {
                    if (entry.isIntersecting) {
                        video.play().catch(()=>{});
                    } else {
                        video.pause();
                    }
                }
            });
        }, { threshold: 0.6 });

        document.querySelectorAll('.reel-card').forEach(card => observer.observe(card));
    }

    function togglePlay(videoEl) {
        if (videoEl.paused) {
            videoEl.play();
        } else {
            videoEl.pause();
        }
    }

    function handleVideoError(videoEl) {
        videoEl.parentElement.innerHTML += '<div style="position:absolute;color:#aaa;">Video yüklenemedi</div>';
    }

    function toggleLike(id) {
        const video = videos.find(v => v.id === id);
        if (video) {
            video.isLiked = !video.isLiked;
            video.likes += video.isLiked ? 1 : -1;
            saveAndRefresh();
        }
    }

    function showHeartAnimation(e, card) {
        const heart = document.createElement('i');
        heart.className = 'fa-solid fa-heart heart-animation';
        const rect = card.getBoundingClientRect();
        const x = (e.changedTouches ? e.changedTouches[0].clientX : e.clientX) - rect.left;
        const y = (e.changedTouches ? e.changedTouches[0].clientY : e.clientY) - rect.top;
        
        heart.style.left = `${x}px`;
        heart.style.top = `${y}px`;
        card.appendChild(heart);
        setTimeout(() => heart.remove(), 800);
    }

    // Yorum İşlemleri
    function openCommentsModal(id) {
        activeVideoId = id;
        renderComments();
        document.getElementById('commentsModal').style.display = 'flex';
    }

    function closeCommentsModal() {
        document.getElementById('commentsModal').style.display = 'none';
    }

    function renderComments() {
        const video = videos.find(v => v.id === activeVideoId);
        const list = document.getElementById('commentsList');
        list.innerHTML = '';

        if (!video || video.comments.length === 0) {
            list.innerHTML = '<div style="color:#666; text-align:center; padding:20px;">İlk yorumu sen yap!</div>';
            return;
        }

        video.comments.forEach(c => {
            const initial = c.user.charAt(0).toUpperCase();
            list.innerHTML += `
                <div class="comment-item">
                    <div class="avatar">${initial}</div>
                    <div class="comment-body">
                        <div class="comment-user">${c.user}</div>
                        <div>${c.text}</div>
                    </div>
                </div>
            `;
        });
    }

    function addComment() {
        const input = document.getElementById('commentInput');
        const userInput = document.getElementById('usernameInput');
        const text = input.value.trim();
        const username = userInput.value.trim() || 'Aga';

        if (text && activeVideoId) {
            localStorage.setItem('agareels_user', username);
            const video = videos.find(v => v.id === activeVideoId);
            video.comments.push({ user: username, text: text });
            input.value = '';
            renderComments();
            saveAndRefresh();
        }
    }

    // Admin Modal İşlemleri (Doğrudan açılır)
    function openAdminModal() {
        document.getElementById('adminModal').style.display = 'flex';
    }

    function closeAdminModal() {
        document.getElementById('adminModal').style.display = 'none';
    }

    function uploadVideo() {
        const fileInput = document.getElementById('videoFileInput');
        const descInput = document.getElementById('videoDescInput');
        const file = fileInput.files[0];

        if (!file) {
            alert('Lütfen bir video dosyası seçin!');
            return;
        }

        const videoUrl = URL.createObjectURL(file);
        const newVideo = {
            id: Date.now(),
            url: videoUrl,
            user: "AdminAga",
            desc: descInput.value || "Yeni video!",
            likes: 0,
            isLiked: false,
            comments: []
        };

        videos.unshift(newVideo);
        saveAndRefresh();
        closeAdminModal();
        fileInput.value = '';
        descInput.value = '';
    }

    function saveAndRefresh() {
        localStorage.setItem('agareels_videos', JSON.stringify(videos));
        renderFeed();
        setupScrollObserver();
    }
</script>
</body>
</html>
