<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AgaReels - Agalarla Reels Keyfi</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }
        body {
            background-color: #000;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .app-container {
            width: 100%;
            max-width: 420px;
            height: 100vh;
            background-color: #000;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        @media (min-width: 450px) {
            .app-container {
                height: 92vh;
                border-radius: 20px;
                border: 1px solid #333;
            }
        }
        
        .content-area {
            flex: 1;
            position: relative;
            overflow: hidden;
        }
        .page {
            display: none;
            height: 100%;
            width: 100%;
            overflow-y: auto;
            position: absolute;
            top: 0;
            left: 0;
            background: #000;
            z-index: 1;
        }
        .page.active {
            display: flex;
            flex-direction: column;
        }

        /* Alt Navigasyon Barı */
        .bottom-nav {
            height: 55px;
            background: #000;
            border-top: 1px solid #222;
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 50;
        }
        .nav-item {
            color: #777;
            background: none;
            border: none;
            font-size: 1.2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            cursor: pointer;
            width: 25%;
        }
        .nav-item span { font-size: 0.65rem; }
        .nav-item.active { color: #fff; }
